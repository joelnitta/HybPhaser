name: precompute-vignettes.yaml

# Re-render vignettes/rhybphaser_targets.Rmd from its .orig source by
# actually running the pipeline (conda + HybPiper + Docker). Opens a PR
# when the committed, pre-rendered vignette changes, so the website output
# does not drift from the code.

on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: precompute-vignettes
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::rmarkdown, any::knitr, any::targets, any::tarchetypes,
            local::.

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true

      - name: Create hybpiper_env
        shell: bash -el {0}
        run: mamba create -n hybpiper_env -c bioconda -c conda-forge -y hybpiper

      - name: Pull rhybphaser Docker image
        run: docker pull joelnitta/rhybphaser:latest

      - name: Install rhybphaser
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Pre-render vignettes
        shell: bash -el {0}
        run: Rscript data-raw/precompute-vignettes.R

      - name: Open PR if the pre-rendered vignette changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: vignettes/
          branch: precompute-vignettes
          delete-branch: true
          commit-message: "Re-render targets vignette from .orig"
          title: "Re-render targets vignette"
          body: >
            Scheduled re-render of `vignettes/rhybphaser_targets.Rmd` from
            `rhybphaser_targets.Rmd.orig`. Merge to refresh the website
            output.
