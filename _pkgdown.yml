url: https://joelnitta.github.io/rhybphaser/

template:
  bootstrap: 5

reference:
- title: Analysis workflow
  desc: >
    The main steps, in the order they are run. See
    `vignette("rhybphaser")` for a worked example.
  contents:
  - run_generate_consensus_sequences
  - count_snps
  - assess_dataset
  - generate_sequence_lists
  - generate_sequence_lists_after_assessment
